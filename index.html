<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>UNAUTHORIZED VERDICT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-black: #060608;
      --card-bg: rgba(14, 14, 18, 0.9);
      --card-border: rgba(239, 68, 68, 0.4);
      --red-bright: #FF2B2B;
      --red-glow: rgba(255, 43, 43, 0.45);
      --red-dark: #7F1D1D;
      --text-main: #FF2B2B;
      --mono-font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --sans-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--sans-font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: max(1rem, env(safe-area-inset-top, 1rem)) max(1rem, env(safe-area-inset-right, 1rem)) max(1.25rem, env(safe-area-inset-bottom, 1.25rem)) max(1rem, env(safe-area-inset-left, 1rem));
      user-select: none;
      perspective: 1200px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.24) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(185, 28, 28, 0.16) 0%, transparent 50%),
        linear-gradient(rgba(239, 68, 68, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239, 68, 68, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }

    .scanline-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.65;
    }

    .ambient-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .tech-crosshair {
      position: absolute;
      font-family: var(--mono-font);
      color: rgba(239, 68, 68, 0.35);
      font-size: 13px;
      line-height: 1;
      font-weight: 300;
      will-change: transform;
    }

    .crosshair-tl { top: max(16px, env(safe-area-inset-top, 16px)); left: max(16px, env(safe-area-inset-left, 16px)); }
    .crosshair-tr { top: max(16px, env(safe-area-inset-top, 16px)); right: max(16px, env(safe-area-inset-right, 16px)); }
    .crosshair-bl { bottom: max(16px, env(safe-area-inset-bottom, 16px)); left: max(16px, env(safe-area-inset-left, 16px)); }
    .crosshair-br { bottom: max(16px, env(safe-area-inset-bottom, 16px)); right: max(16px, env(safe-area-inset-right, 16px)); }

    .splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #050507;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(1rem, env(safe-area-inset-top, 1rem)) max(1rem, env(safe-area-inset-right, 1rem)) max(1.5rem, env(safe-area-inset-bottom, 1.5rem)) max(1rem, env(safe-area-inset-left, 1rem));
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(220, 38, 38, 0.18) 0%, transparent 65%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    .splash-card {
      width: 100%;
      max-width: 440px;
      background: rgba(13, 13, 17, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: clamp(14px, 3.5vw, 20px);
      padding: clamp(1.75rem, 6vw, 2.5rem) clamp(1.25rem, 5vw, 2rem);
      box-shadow: 0 0 50px -10px rgba(220, 38, 38, 0.3), 0 20px 40px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      will-change: transform, opacity;
    }

    .splash-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.4vw, 0.8rem);
      color: #A1A1AA;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--red-bright);
      flex-shrink: 0;
    }

    .splash-title {
      font-family: var(--mono-font);
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #FAFAFA;
      margin-bottom: 1.5rem;
      line-height: 1.2;
      text-shadow: 0 0 25px rgba(255, 43, 43, 0.65);
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 0.85rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--red-bright);
      box-shadow: 0 0 18px var(--red-bright);
      border-radius: 9999px;
    }

    .progress-footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.4vw, 0.8rem);
      color: #71717A;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .progress-percent {
      color: var(--red-bright);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .skip-btn {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      font-family: var(--mono-font);
      font-size: 0.75rem;
      color: #71717A;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(13, 13, 17, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .skip-btn:hover, .skip-btn:active {
      color: #FAFAFA;
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(220, 38, 38, 0.15);
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.5rem;
      opacity: 0;
      transform: scale(0.92);
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .statement-card {
      background: var(--card-bg);
      border-radius: clamp(20px, 5vw, 32px);
      padding: clamp(2.2rem, 7vw, 4.5rem) clamp(1.2rem, 5.5vw, 4rem);
      box-shadow: 0 0 60px -15px rgba(220, 38, 38, 0.35), 0 30px 60px rgba(0, 0, 0, 0.9);
      border: 1px solid var(--card-border);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.1rem, 3.5vw, 1.7rem);
      width: 100%;
      backdrop-filter: blur(20px);
      touch-action: manipulation;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
    }

    .statement-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: clamp(21px, 5vw, 33px);
      padding: 1px;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.6) 0%, transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .main-text {
      font-size: clamp(1.35rem, 4vw, 2.75rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.25;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 28px var(--red-glow);
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
      perspective: 800px;
    }

    .dialogue-line {
      display: block;
      margin-bottom: 0.4em;
    }

    .dialogue-line:last-child {
      margin-bottom: 0;
    }

    .speaker-tag {
      color: #FAFAFA !important;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.65) !important;
      font-family: var(--mono-font);
      letter-spacing: 0.04em;
      margin-right: 0.15em;
    }

    .word-wrapper {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      margin: 0 0.15em;
    }

    .word-span {
      display: inline-block;
      will-change: transform, opacity;
      transform-origin: 50% 100%;
    }

    .click-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.4vw, 0.82rem);
      font-weight: 700;
      color: var(--red-bright);
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.2);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.25rem;
      pointer-events: none;
    }

    .click-hint-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--red-bright);
      flex-shrink: 0;
    }

    .realtime-dashboard {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .realtime-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.2vw, 0.82rem);
      font-weight: 700;
      color: #FAFAFA;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(220, 38, 38, 0.08);
      padding: 0.45rem 1.25rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      pointer-events: none;
      will-change: transform;
    }

    .realtime-pill .live-val {
      color: var(--red-bright);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }

    .view-pulse {
      width: 6px;
      height: 6px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--red-bright);
      flex-shrink: 0;
    }

    .mobile-controls {
      display: none;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        justify-content: flex-start;
      }

      .ambient-grid,
      .scanline-overlay {
        display: none;
      }

      .content-wrapper {
        padding: 0;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .statement-card {
        border-radius: 0;
        border: none;
        border-bottom: 1px solid rgba(239, 68, 68, 0.25);
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1.5rem 1.25rem;
        gap: 1.25rem;
      }

      .statement-card::before {
        display: none;
      }

      .main-text {
        font-size: clamp(1.15rem, 5.2vw, 1.75rem);
        line-height: 1.28;
        text-shadow: 0 0 24px rgba(255, 43, 43, 0.5);
      }

      .click-hint {
        display: none;
      }

      .mobile-header-bar {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(14px, env(safe-area-inset-top, 14px)) 16px 10px 16px;
        background: rgba(10, 10, 14, 0.95);
        border-bottom: 1px solid rgba(239, 68, 68, 0.25);
        backdrop-filter: blur(12px);
        font-family: var(--mono-font);
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        z-index: 20;
      }

      .mobile-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #FAFAFA;
        font-weight: 700;
      }

      .mobile-badge span span {
        color: var(--red-bright);
        font-weight: 800;
      }

      .mobile-controls {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding: 14px 16px max(18px, env(safe-area-inset-bottom, 18px)) 16px;
        background: rgba(10, 10, 14, 0.95);
        border-top: 1px solid rgba(239, 68, 68, 0.25);
        backdrop-filter: blur(12px);
        z-index: 20;
      }

      .mobile-action-btn {
        width: 100%;
        padding: 1rem 1.25rem;
        background: var(--red-bright);
        color: #FFFFFF;
        border: none;
        border-radius: 12px;
        font-family: var(--mono-font);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 4px 20px rgba(255, 43, 43, 0.4);
        cursor: pointer;
        touch-action: manipulation;
        will-change: transform;
      }

      .mobile-meta-ticker {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: var(--mono-font);
        font-size: 0.7rem;
        color: #71717A;
      }

      .desktop-only {
        display: none !important;
      }
    }

    @media (min-width: 641px) {
      .mobile-only {
        display: none !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="scanline-overlay" aria-hidden="true"></div>

  <div class="ambient-grid" aria-hidden="true">
    <div class="tech-crosshair crosshair-tl">+</div>
    <div class="tech-crosshair crosshair-tr">+</div>
    <div class="tech-crosshair crosshair-bl">+</div>
    <div class="tech-crosshair crosshair-br">+</div>
  </div>

  <div class="splash-overlay" id="splashScreen">
    <div class="splash-card" id="splashCard">
      <div class="splash-badge">
        <span class="pulse-dot"></span>
        <span>SECURITY BREACH</span>
      </div>

      <div class="splash-title" id="splashTitle">HACKING SYSTEM...</div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="progress-footer">
        <span class="progress-state" id="splashState">BYPASSING FIREWALL</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
    </div>

    <button type="button" class="skip-btn" id="btnSkip">
      [ SKIP ]
    </button>
  </div>

  <div class="content-wrapper" id="contentWrapper">
    <div class="mobile-header-bar mobile-only">
      <div class="mobile-badge">
        <span class="view-pulse"></span>
        <span>LIVE <span id="mobileActiveUsers">38</span> VIEWING NOW</span>
      </div>
    </div>

    <div class="statement-card" id="card">
      <h1 class="main-text" id="statementText"></h1>

      <div class="click-hint desktop-only">
        <span class="click-hint-indicator"></span>
        <span>Click anywhere for next verdict</span>
      </div>

      <div class="realtime-dashboard desktop-only">
        <div class="realtime-pill live-active" id="livePill">
          <span class="view-pulse"></span>
          <span><span class="live-val" id="activeUsersCount">38</span> active right now</span>
        </div>
      </div>
    </div>

    <div class="mobile-controls mobile-only">
      <button type="button" class="mobile-action-btn" id="btnMobileNext">
        <span>NEXT VERDICT</span>
        <span>→</span>
      </button>
      <div class="mobile-meta-ticker">
        <span>● REALTIME TELEMETRY ACTIVE</span>
      </div>
    </div>
  </div>

  <script>
    const STATEMENTS = [
      "Doctor: \"You need to stop drinking.\"\nMe: \"Okay, doctor. What should I drink instead?\"",
      "Teacher: \"Why are you late?\"\nStudent: \"Because of the sign.\"\nTeacher: \"What sign?\"\nStudent: \"School Ahead — Go Slow.\"",
      "I told my wife I was going to make a bicycle out of spaghetti. She said, \"That's impossible.\" You should have seen her face when I rode pasta.",
      "Mom: \"Why is your room so messy?\"\nMe: \"It's not messy. I'm just testing the floor's ability to hold objects.\"",
      "I asked my dog, \"What's two minus two?\" He said nothing. Exactly — he has no idea.",
      "Friend: \"Bro, why are you talking to yourself?\"\nMe: \"Because I need expert advice.\"",
      "I put my phone on airplane mode. Now it just sits there doing absolutely nothing, like a real airplane passenger.",
      "Dad: \"Why did you get a zero on your test?\"\nMe: \"The teacher said I was being too honest.\"\nDad: \"How?\"\nMe: \"I left every answer blank.\"",
      "My alarm clock and I have a toxic relationship. Every morning it screams at me, and I hit it.",
      "Teacher: \"Use the word 'definitely' in a sentence.\"\nStudent: \"I definitely don't know how to spell it.\"",
      "I started exercising every day. Today I did one push-up. Tomorrow I'm going to do another one.",
      "Friend: \"Are you good at math?\"\nMe: \"Yes.\"\nFriend: \"What's 7 × 8?\"\nMe: \"Definitely 56.\"\nFriend: \"You're not sure?\"\nMe: \"I'm sure it's one of those numbers.\"",
      "I told my computer I needed more space. Now it keeps showing me ads for bigger houses.",
      "Mom: \"Why did you eat the whole cake?\"\nMe: \"I didn't want it to feel lonely.\"",
      "I tried to organize my life, but I lost the checklist.",
      "Boss: \"You're late again!\"\nMe: \"I know. I was following my dreams.\"\nBoss: \"What dreams?\"\nMe: \"Sleeping until noon.\"",
      "My bank account is like a magic trick: I put money in, and poof — it disappears.",
      "I bought a smart refrigerator. Now it knows I'm eating at midnight and judges me silently.",
      "Friend: \"Why did you delete your dating app?\"\nMe: \"It kept matching me with people I already rejected in real life.\"",
      "I don't need Google. I have a mother who knows everything I did before I even did it.",
      "Teacher: \"What is the opposite of 'artificial'?\"\nStudent: \"Artifish.\"",
      "I told my parents I wanted to become a comedian. They laughed. I guess I already have my first audience.",
      "Friend: \"Why are you wearing sunglasses indoors?\"\nMe: \"My future is so bright, I need protection.\"",
      "I'm excellent at multitasking. I can waste time, be unproductive, and procrastinate all at once.",
      "Mom: \"Did you clean your room?\"\nMe: \"Yes.\"\nMom: \"Then why can't I see the floor?\"\nMe: \"Because I cleaned everything onto the bed.\"",
      "My phone battery lasts longer than my motivation.",
      "Friend: \"What's your biggest achievement?\"\nMe: \"I once opened the fridge and remembered why I opened it.\"",
      "I wanted to lose weight, so I threw my bathroom scale in the trash. Problem solved.",
      "Teacher: \"Where is your homework?\"\nStudent: \"In my house.\"\nTeacher: \"Why didn't you bring it?\"\nStudent: \"It didn't want to come.\"",
      "I finally got eight hours of sleep last night. Unfortunately, it took me three nights to complete it."
    ];

    let currentIndex = 0;
    let splashCompleted = false;
    let isAnimatingText = false;

    const splashScreen = document.getElementById("splashScreen");
    const splashCard = document.getElementById("splashCard");
    const splashTitle = document.getElementById("splashTitle");
    const splashState = document.getElementById("splashState");
    const progressFill = document.getElementById("progressFill");
    const progressPercent = document.getElementById("progressPercent");
    const contentWrapper = document.getElementById("contentWrapper");
    const card = document.getElementById("card");
    const statementText = document.getElementById("statementText");
    const btnSkip = document.getElementById("btnSkip");
    const activeUsersCount = document.getElementById("activeUsersCount");
    const mobileActiveUsers = document.getElementById("mobileActiveUsers");
    const btnMobileNext = document.getElementById("btnMobileNext");
    const livePill = document.getElementById("livePill");

    let currentActiveViewers = 38;

    function renderWords(text) {
      const lines = text.split("\n");
      statementText.innerHTML = lines
        .map(line => {
          const words = line.trim().split(/\s+/).filter(Boolean);
          const renderedLine = words
            .map(w => {
              const isSpeaker = /^[A-Za-z]+:$/.test(w);
              const cls = isSpeaker ? "word-span speaker-tag" : "word-span";
              return `<span class="word-wrapper"><span class="${cls}">${w}</span></span>`;
            })
            .join(" ");
          return `<div class="dialogue-line">${renderedLine}</div>`;
        })
        .join("");
    }

    function initAmbientGSAP() {
      if (typeof gsap === "undefined") return;

      gsap.to(".tech-crosshair", {
        rotation: "+=360",
        duration: 32,
        repeat: -1,
        ease: "none"
      });

      gsap.to(".crosshair-tl, .crosshair-br", {
        y: "+=10",
        duration: 3.5,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      gsap.to(".crosshair-tr, .crosshair-bl", {
        y: "-=10",
        duration: 4,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      gsap.to(".pulse-dot, .view-pulse", {
        scale: 1.45,
        filter: "drop-shadow(0 0 12px #FF2B2B)",
        duration: 0.75,
        yoyo: true,
        repeat: -1,
        ease: "power2.inOut"
      });

      window.addEventListener("mousemove", (e) => {
        if (!splashCompleted || window.innerWidth <= 640) return;
        const normX = (e.clientX / window.innerWidth) - 0.5;
        const normY = (e.clientY / window.innerHeight) - 0.5;
        gsap.to(card, {
          rotateY: normX * 8,
          rotateX: -normY * 8,
          transformPerspective: 1000,
          duration: 0.6,
          ease: "power2.out"
        });
      });

      window.addEventListener("mouseleave", () => {
        if (window.innerWidth <= 640) return;
        gsap.to(card, {
          rotateY: 0,
          rotateX: 0,
          duration: 0.8,
          ease: "elastic.out(1, 0.45)"
        });
      });
    }

    function initRealtimeActive() {
      currentActiveViewers = Math.floor(Math.random() * 15) + 32;
      updateActiveDisplays(currentActiveViewers);

      setInterval(() => {
        const delta = Math.floor(Math.random() * 5) - 2;
        currentActiveViewers = Math.max(18, Math.min(84, currentActiveViewers + delta));
        updateActiveDisplays(currentActiveViewers);
      }, 3500);
    }

    function updateActiveDisplays(active) {
      if (typeof gsap !== "undefined") {
        gsap.timeline()
          .fromTo([activeUsersCount, mobileActiveUsers],
            { scale: 1.35, color: "#FFFFFF", textShadow: "0 0 16px #FF2B2B" },
            { scale: 1, color: "var(--red-bright)", textShadow: "none", duration: 0.45, ease: "elastic.out(1, 0.4)" }
          );
        if (livePill) {
          gsap.fromTo(livePill,
            { borderColor: "rgba(255, 43, 43, 0.8)", boxShadow: "0 0 20px rgba(255, 43, 43, 0.35)" },
            { borderColor: "rgba(239, 68, 68, 0.35)", boxShadow: "none", duration: 0.6 }
          );
        }
      }
      if (activeUsersCount) activeUsersCount.textContent = active;
      if (mobileActiveUsers) mobileActiveUsers.textContent = active;
    }

    function runSplashSequence() {
      if (typeof gsap === "undefined") {
        finishSplash();
        return;
      }

      const tl = gsap.timeline({
        onComplete: finishSplash
      });

      tl.fromTo(splashCard, 
        { opacity: 0, scale: 0.94, y: 16, filter: "blur(6px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }
      );

      tl.to(progressFill, {
        width: "100%",
        duration: 1.4,
        ease: "power2.inOut"
      }, 0.2);

      const counterObj = { val: 0 };
      tl.to(counterObj, {
        val: 100,
        duration: 1.4,
        ease: "power2.inOut",
        onUpdate: () => {
          const v = Math.round(counterObj.val);
          progressPercent.textContent = v + "%";
          if (v > 65 && splashState && splashState.textContent !== "ACCESS GRANTED") {
            splashState.textContent = "ACCESS GRANTED";
          }
        }
      }, 0.2);

      tl.call(() => {
        if (splashTitle) {
          splashTitle.textContent = "SYSTEM HACKED!";
        }
      }, null, 1.45);

      tl.to(splashCard, {
        boxShadow: "0 0 80px rgba(255, 43, 43, 0.75), 0 0 20px rgba(255, 43, 43, 0.5)",
        borderColor: "#FF2B2B",
        duration: 0.18,
        yoyo: true,
        repeat: 1
      }, 1.45);

      tl.to(splashScreen, {
        opacity: 0,
        scale: 1.06,
        filter: "blur(10px)",
        duration: 0.35,
        ease: "power3.inOut",
        pointerEvents: "none"
      }, 1.75);
    }

    function finishSplash() {
      if (splashCompleted) return;
      splashCompleted = true;

      if (typeof gsap !== "undefined") {
        gsap.killTweensOf([splashScreen, splashCard, progressFill]);
      }

      splashScreen.style.display = "none";
      currentIndex = Math.floor(Math.random() * STATEMENTS.length);
      renderWords(STATEMENTS[currentIndex]);

      if (typeof gsap !== "undefined") {
        gsap.to(contentWrapper, {
          opacity: 1,
          scale: 1,
          duration: 0.6,
          ease: "power3.out"
        });

        gsap.fromTo(".word-span",
          { y: 35, opacity: 0, rotateX: -60, filter: "blur(6px)" },
          { y: 0, opacity: 1, rotateX: 0, filter: "blur(0px)", stagger: 0.04, duration: 0.55, ease: "back.out(1.8)" }
        );

        gsap.fromTo(card,
          { boxShadow: "0 0 0px transparent" },
          { boxShadow: "0 0 60px -15px rgba(220, 38, 38, 0.35), 0 30px 60px rgba(0, 0, 0, 0.9)", duration: 0.8 }
        );
      } else {
        contentWrapper.style.opacity = "1";
        contentWrapper.style.transform = "scale(1)";
      }
    }

    btnSkip.addEventListener("click", (e) => {
      e.stopPropagation();
      finishSplash();
    });

    splashScreen.addEventListener("click", (e) => {
      if (e.target && e.target.closest("#btnSkip")) return;
      finishSplash();
    });

    function showNextStatement() {
      if (!splashCompleted) {
        finishSplash();
        return;
      }
      if (isAnimatingText) return;

      if (navigator.vibrate) {
        try { navigator.vibrate(25); } catch(e) {}
      }

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * STATEMENTS.length);
      } while (nextIndex === currentIndex && STATEMENTS.length > 1);

      currentIndex = nextIndex;
      const newText = STATEMENTS[currentIndex];

      if (typeof gsap !== "undefined") {
        isAnimatingText = true;

        const currentWordSpans = document.querySelectorAll(".word-span");

        const tl = gsap.timeline({
          onComplete: () => {
            isAnimatingText = false;
          }
        });

        tl.to(currentWordSpans, {
          y: -25,
          opacity: 0,
          rotateX: 45,
          filter: "blur(4px)",
          stagger: 0.015,
          duration: 0.15,
          ease: "power2.in",
          onComplete: () => {
            renderWords(newText);
          }
        });

        tl.fromTo(card,
          { scale: 0.97, borderColor: "rgba(255, 43, 43, 0.9)", boxShadow: "0 0 90px rgba(255, 43, 43, 0.6), 0 35px 70px rgba(0,0,0,0.95)" },
          { scale: 1, borderColor: "var(--card-border)", boxShadow: "0 0 60px -15px rgba(220, 38, 38, 0.35), 0 30px 60px rgba(0, 0, 0, 0.9)", duration: 0.35, ease: "back.out(2)" },
          "-=0.1"
        );

        tl.fromTo(".word-span",
          { y: 35, opacity: 0, rotateX: -60, filter: "blur(6px)" },
          { y: 0, opacity: 1, rotateX: 0, filter: "blur(0px)", stagger: 0.035, duration: 0.45, ease: "back.out(1.8)" },
          "-=0.1"
        );

        if (btnMobileNext) {
          gsap.fromTo(btnMobileNext,
            { scale: 0.94 },
            { scale: 1, duration: 0.35, ease: "elastic.out(1.2, 0.4)" }
          );
        }
      } else {
        renderWords(newText);
      }
    }

    document.addEventListener("click", (e) => {
      if (e.target && e.target.closest("#btnSkip")) return;
      showNextStatement();
    });

    if (btnMobileNext) {
      btnMobileNext.addEventListener("click", (e) => {
        e.stopPropagation();
        showNextStatement();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        showNextStatement();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      initAmbientGSAP();
      initRealtimeActive();
      runSplashSequence();
    });
  </script>
</body>
</html>
