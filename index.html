<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>UNAUTHORIZED VERDICT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-black: #060608;
      --card-bg: rgba(14, 14, 18, 0.9);
      --card-border: rgba(239, 68, 68, 0.4);
      --red-bright: #FF2B2B;
      --red-glow: rgba(255, 43, 43, 0.45);
      --red-dark: #7F1D1D;
      --text-main: #FF2B2B;
      --mono-font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --sans-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--sans-font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: max(1rem, env(safe-area-inset-top, 1rem)) max(1rem, env(safe-area-inset-right, 1rem)) max(1.25rem, env(safe-area-inset-bottom, 1.25rem)) max(1rem, env(safe-area-inset-left, 1rem));
      user-select: none;
      perspective: 1200px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.24) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(185, 28, 28, 0.16) 0%, transparent 50%),
        linear-gradient(rgba(239, 68, 68, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239, 68, 68, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }

    .scanline-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.65;
    }

    .ambient-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .tech-crosshair {
      position: absolute;
      font-family: var(--mono-font);
      color: rgba(239, 68, 68, 0.35);
      font-size: 13px;
      line-height: 1;
      font-weight: 300;
      will-change: transform;
    }

    .crosshair-tl { top: max(16px, env(safe-area-inset-top, 16px)); left: max(16px, env(safe-area-inset-left, 16px)); }
    .crosshair-tr { top: max(16px, env(safe-area-inset-top, 16px)); right: max(16px, env(safe-area-inset-right, 16px)); }
    .crosshair-bl { bottom: max(16px, env(safe-area-inset-bottom, 16px)); left: max(16px, env(safe-area-inset-left, 16px)); }
    .crosshair-br { bottom: max(16px, env(safe-area-inset-bottom, 16px)); right: max(16px, env(safe-area-inset-right, 16px)); }

    .splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #050507;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(1rem, env(safe-area-inset-top, 1rem)) max(1rem, env(safe-area-inset-right, 1rem)) max(1.5rem, env(safe-area-inset-bottom, 1.5rem)) max(1rem, env(safe-area-inset-left, 1rem));
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(220, 38, 38, 0.18) 0%, transparent 65%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    .splash-card {
      width: 100%;
      max-width: 440px;
      background: rgba(13, 13, 17, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: clamp(14px, 3.5vw, 20px);
      padding: clamp(1.75rem, 6vw, 2.5rem) clamp(1.25rem, 5vw, 2rem);
      box-shadow: 0 0 50px -10px rgba(220, 38, 38, 0.3), 0 20px 40px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      will-change: transform, opacity;
    }

    .splash-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.4vw, 0.8rem);
      color: #A1A1AA;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--red-bright);
      flex-shrink: 0;
    }

    .splash-title {
      font-family: var(--mono-font);
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #FAFAFA;
      margin-bottom: 1.5rem;
      line-height: 1.2;
      text-shadow: 0 0 25px rgba(255, 43, 43, 0.65);
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 0.85rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--red-bright);
      box-shadow: 0 0 18px var(--red-bright);
      border-radius: 9999px;
    }

    .progress-footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.4vw, 0.8rem);
      color: #71717A;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .progress-percent {
      color: var(--red-bright);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .skip-btn {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      font-family: var(--mono-font);
      font-size: 0.75rem;
      color: #71717A;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(13, 13, 17, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .skip-btn:hover, .skip-btn:active {
      color: #FAFAFA;
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(220, 38, 38, 0.15);
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.5rem;
      opacity: 1;
      transform: none;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .statement-card {
      background: var(--card-bg);
      border-radius: clamp(20px, 5vw, 32px);
      padding: clamp(2.2rem, 7vw, 4.5rem) clamp(1.2rem, 5.5vw, 4rem);
      box-shadow: 0 0 60px -15px rgba(220, 38, 38, 0.35), 0 30px 60px rgba(0, 0, 0, 0.9);
      border: 1px solid var(--card-border);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.1rem, 3.5vw, 1.7rem);
      width: 100%;
      backdrop-filter: blur(20px);
      touch-action: manipulation;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
    }

    .statement-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: clamp(21px, 5vw, 33px);
      padding: 1px;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.6) 0%, transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .main-text {
      font-size: clamp(1.35rem, 4vw, 2.75rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.25;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 28px var(--red-glow);
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
      perspective: 800px;
    }

    .dialogue-line {
      display: block;
      margin-bottom: 0.4em;
    }

    .dialogue-line:last-child {
      margin-bottom: 0;
    }

    .speaker-tag {
      color: #FAFAFA !important;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.65) !important;
      font-family: var(--mono-font);
      letter-spacing: 0.04em;
      margin-right: 0.15em;
    }

    .word-wrapper {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      margin: 0 0.15em;
    }

    .word-span {
      display: inline-block;
      will-change: transform, opacity;
      transform-origin: 50% 100%;
    }

    .click-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.4vw, 0.82rem);
      font-weight: 700;
      color: var(--red-bright);
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.2);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.25rem;
      pointer-events: none;
    }

    .click-hint-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--red-bright);
      flex-shrink: 0;
    }

    .realtime-dashboard {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .realtime-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--mono-font);
      font-size: clamp(0.72rem, 2.2vw, 0.82rem);
      font-weight: 700;
      color: #FAFAFA;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(220, 38, 38, 0.08);
      padding: 0.45rem 1.25rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      pointer-events: none;
      will-change: transform;
    }

    .realtime-pill .live-val {
      color: var(--red-bright);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }

    .view-pulse {
      width: 6px;
      height: 6px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--red-bright);
      flex-shrink: 0;
    }

    .mobile-controls {
      display: none;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        justify-content: flex-start;
      }

      .ambient-grid,
      .scanline-overlay {
        display: none;
      }

      .content-wrapper {
        padding: 0;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .statement-card {
        border-radius: 0;
        border: none;
        border-bottom: 1px solid rgba(239, 68, 68, 0.25);
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1.5rem 1.25rem;
        gap: 1.25rem;
      }

      .statement-card::before {
        display: none;
      }

      .main-text {
        font-size: clamp(1.15rem, 5.2vw, 1.75rem);
        line-height: 1.28;
        text-shadow: 0 0 24px rgba(255, 43, 43, 0.5);
      }

      .click-hint {
        display: none;
      }

      .mobile-header-bar {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(14px, env(safe-area-inset-top, 14px)) 16px 10px 16px;
        background: rgba(10, 10, 14, 0.95);
        border-bottom: 1px solid rgba(239, 68, 68, 0.25);
        backdrop-filter: blur(12px);
        font-family: var(--mono-font);
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        z-index: 20;
      }

      .mobile-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #FAFAFA;
        font-weight: 700;
      }

      .mobile-badge span span {
        color: var(--red-bright);
        font-weight: 800;
      }

      .mobile-controls {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding: 14px 16px max(18px, env(safe-area-inset-bottom, 18px)) 16px;
        background: rgba(10, 10, 14, 0.95);
        border-top: 1px solid rgba(239, 68, 68, 0.25);
        backdrop-filter: blur(12px);
        z-index: 20;
      }

      .mobile-action-btn {
        width: 100%;
        padding: 1rem 1.25rem;
        background: var(--red-bright);
        color: #FFFFFF;
        border: none;
        border-radius: 12px;
        font-family: var(--mono-font);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 4px 20px rgba(255, 43, 43, 0.4);
        cursor: pointer;
        touch-action: manipulation;
        will-change: transform;
      }

      .mobile-meta-ticker {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: var(--mono-font);
        font-size: 0.7rem;
        color: #71717A;
      }

      .desktop-only {
        display: none !important;
      }
    }

    @media (min-width: 641px) {
      .mobile-only {
        display: none !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="scanline-overlay" aria-hidden="true"></div>

  <div class="ambient-grid" aria-hidden="true">

  <div class="content-wrapper" id="contentWrapper">

  <script>
    const STATEMENTS = [
      "My wife told me to stop impersonating a flamingo. I had to put my foot down.",
      "I told my doctor that I broke my arm in two places. He told me to stop going to those places.",
      "Why don't scientists trust atoms? Because they make up everything.",

      "Why do cows have hooves instead of feet? Because they lactose.",
      "What do you call a factory that makes okay products? A satisfactory.",
      "I went to buy some camouflage trousers yesterday, but I couldn't find any.",
      "A guy walks into a bar with a piece of asphalt under his arm and says, \"A beer for me, and one for the road.\"",
      "Why did the math book look sad? Because it had too many problems.",
      "What do you call an alligator in a vest? An investigator.",

      "What do you get from a pampered cow? Spoiled milk.",
      "How does a penguin build its house? Igloos it together.",
      "Why was the belt arrested? For holding up a pair of pants.",
      "I’m reading a book on anti-gravity. I just can’t put it down.",
      "A perfectionist walked into a bar... apparently, the bar wasn’t set high enough.",
      "Why don’t oysters donate to charity? Because they’re shellfish.",
      "How do you organize a space party? You planet.",
      "What did the grape do when he got stepped on? Nothing, he just let out a little wine.",
      "I invented a new word today! Plagiarism.",
      "What’s orange and sounds like a parrot? A carrot.",
      "What did one plate whisper to the other plate? \"Dinner is on me.\"",
      "I stayed up all night wondering where the sun went. Then it dawned on me.",
      "Why don't skeletons fight each other? They don't have the guts.",
      "A man sued an airline for losing his luggage. He lost his case.",
      "What did the ocean say to the shore? Nothing, it just waved.",
      "Why did the golfer bring two pairs of pants? In case he got a hole in one.",
      "Where does the general keep his armies? In his sleevies.",
      "I was wondering why the ball was getting bigger. Then it hit me.",
      "What’s the easiest way to make a tissue dance? Put a little boogie in it.",

    ];

    let currentIndex = 0;
    let splashCompleted = false;
    let isAnimatingText = false;
    let currentActiveViewers = 38;
    let activeParticles = 0;
    const MAX_PARTICLES = 24;

    const splashScreen = document.getElementById("splashScreen");
    const splashCard = document.getElementById("splashCard");
    const splashTitle = document.getElementById("splashTitle");
    const splashState = document.getElementById("splashState");
    const progressFill = document.getElementById("progressFill");
    const progressPercent = document.getElementById("progressPercent");
    const contentWrapper = document.getElementById("contentWrapper");
    const card = document.getElementById("card");
    const statementText = document.getElementById("statementText");
    const btnSkip = document.getElementById("btnSkip");
    const activeUsersCount = document.getElementById("activeUsersCount");
    const mobileActiveUsers = document.getElementById("mobileActiveUsers");
    const btnMobileNext = document.getElementById("btnMobileNext");
    const livePill = document.getElementById("livePill");

    let animContext = null;
    let realtimeDelayedCall = null;
    let cardHoverScaleQuick = null;
    let cardHoverRotQuick = null;
    let cardTiltXQuick = null;
    let cardTiltYQuick = null;
    let crosshairQuickX = null;
    let crosshairQuickY = null;

    function renderWords(text) {
      const lines = text.split("\n");
      statementText.innerHTML = lines
        .map(line => {
          const words = line.trim().split(/\s+/).filter(Boolean);
          const renderedLine = words
            .map(w => {
              const isSpeaker = /:$/.test(w);
              const cls = isSpeaker ? "word-span speaker-tag" : "word-span";
              return `<span class="word-wrapper"><span class="${cls}">${w}</span></span>`;
            })
            .join(" ");
          return `<div class="dialogue-line">${renderedLine}</div>`;
        })
        .join("");
    }

    function cleanupAnimations() {
      if (realtimeDelayedCall) {
        realtimeDelayedCall.kill();
        realtimeDelayedCall = null;
      }
      if (animContext) {
        animContext.revert();
        animContext = null;
      }
      if (typeof ScrollTrigger !== "undefined") {
        ScrollTrigger.getAll().forEach(t => t.kill());
      }
      const existingParticles = document.querySelectorAll(".emoji-particle");
      existingParticles.forEach(p => p.remove());
      activeParticles = 0;
    }

    function spawnEmojiBurst(x, y) {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (activeParticles >= MAX_PARTICLES) return;

      const emojis = ["😂", "💀", "🔥", "🤣", "👀", "💯"];
      const burstCount = 6;
      const targetX = (typeof x === "number" && !isNaN(x)) ? x : (window.innerWidth / 2);
      const targetY = (typeof y === "number" && !isNaN(y)) ? y : (window.innerHeight / 2);

      for (let i = 0; i < burstCount; i++) {
        activeParticles++;
        const p = document.createElement("span");
        p.className = "emoji-particle";
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.cssText = `position:fixed;left:${targetX}px;top:${targetY}px;pointer-events:none;z-index:9999;user-select:none;font-size:${18 + Math.floor(Math.random() * 8)}px;will-change:transform,opacity;transform:translate(-50%,-50%);`;
        document.body.appendChild(p);

        const angle = (Math.PI * 2 * i) / burstCount + (Math.random() - 0.5) * 0.4;
        const dist = 35 + Math.random() * 50;
        const destX = Math.cos(angle) * dist;
        const destY = Math.sin(angle) * dist - 25;

        gsap.to(p, {
          x: destX,
          y: destY,
          rotation: (Math.random() - 0.5) * 60,
          scale: 1.35,
          opacity: 0,
          duration: 0.65 + Math.random() * 0.25,
          ease: "power2.out",
          onComplete: () => {
            activeParticles--;
            if (p.parentNode) {
              p.parentNode.removeChild(p);
            }
          }
        });
      }
    }

    function animateButtonPop(btn) {
      if (!btn || typeof gsap === "undefined") return;
      gsap.timeline()
        .to(btn, { scale: 0.88, duration: 0.08, ease: "power1.in" })
        .to(btn, { scale: 1.08, duration: 0.16, ease: "back.out(2.5)" })
        .to(btn, { scale: 1, duration: 0.1, ease: "power2.out", clearProps: "transform" });
    }

    function updateActiveDisplays(active) {
      if (typeof gsap !== "undefined") {
        const currentVal = parseInt((activeUsersCount && activeUsersCount.textContent) || currentActiveViewers, 10) || currentActiveViewers;
        const counterProxy = { val: currentVal };

        gsap.to(counterProxy, {
          val: active,
          duration: 0.8,
          ease: "power2.out",
          onUpdate: () => {
            const rounded = Math.round(counterProxy.val);
            if (activeUsersCount) activeUsersCount.textContent = rounded;
            if (mobileActiveUsers) mobileActiveUsers.textContent = rounded;
          }
        });

        gsap.timeline()
          .fromTo([activeUsersCount, mobileActiveUsers],
            { scale: 1.35, color: "#FFFFFF", textShadow: "0 0 16px #FF2B2B" },
            { scale: 1, color: "var(--red-bright)", textShadow: "none", duration: 0.45, ease: "elastic.out(1, 0.4)", clearProps: "transform,color,textShadow" }
          );

        if (livePill) {
          gsap.fromTo(livePill,
            { borderColor: "rgba(255, 43, 43, 0.8)", boxShadow: "0 0 20px rgba(255, 43, 43, 0.35)" },
            { borderColor: "rgba(239, 68, 68, 0.35)", boxShadow: "none", duration: 0.6, clearProps: "borderColor,boxShadow" }
          );
        }
      } else {
        if (activeUsersCount) activeUsersCount.textContent = active;
        if (mobileActiveUsers) mobileActiveUsers.textContent = active;
      }
    }

    function initRealtimeActive() {
      currentActiveViewers = Math.floor(Math.random() * 15) + 32;
      updateActiveDisplays(currentActiveViewers);

      function scheduleTick() {
        if (typeof gsap === "undefined") return;
        realtimeDelayedCall = gsap.delayedCall(3.5, () => {
          const delta = Math.floor(Math.random() * 5) - 2;
          currentActiveViewers = Math.max(18, Math.min(84, currentActiveViewers + delta));
          updateActiveDisplays(currentActiveViewers);
          scheduleTick();
        });
      }
      scheduleTick();
    }

    function initAmbientGSAP() {
      if (typeof gsap === "undefined") return;

      gsap.to(".tech-crosshair", {
        rotation: "+=360",
        duration: 32,
        repeat: -1,
        ease: "none"
      });

      gsap.to(".crosshair-tl, .crosshair-br", {
        y: "+=10",
        duration: 3.5,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      gsap.to(".crosshair-tr, .crosshair-bl", {
        y: "-=10",
        duration: 4,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      gsap.to(".pulse-dot, .view-pulse", {
        scale: 1.45,
        filter: "drop-shadow(0 0 12px #FF2B2B)",
        duration: 0.75,
        yoyo: true,
        repeat: -1,
        ease: "power2.inOut"
      });
    }

    function initInteractiveGSAP() {
      if (typeof gsap === "undefined") return;

      if (card) {
        cardHoverScaleQuick = gsap.quickTo(card, "scale", { duration: 0.3, ease: "power2.out" });
        cardHoverRotQuick = gsap.quickTo(card, "rotation", { duration: 0.3, ease: "power2.out" });
        cardTiltXQuick = gsap.quickTo(card, "rotateX", { duration: 0.5, ease: "power2.out" });
        cardTiltYQuick = gsap.quickTo(card, "rotateY", { duration: 0.5, ease: "power2.out" });

        card.onmouseenter = () => {
          if (window.innerWidth <= 640) return;
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          if (cardHoverScaleQuick) cardHoverScaleQuick(1.015);
          if (cardHoverRotQuick) cardHoverRotQuick(0.35);
        };

        card.onmouseleave = () => {
          if (window.innerWidth <= 640) return;
          if (cardHoverScaleQuick) cardHoverScaleQuick(1);
          if (cardHoverRotQuick) cardHoverRotQuick(0);
        };
      }

      const crosshairs = gsap.utils.toArray(".tech-crosshair");
      if (crosshairs.length) {
        crosshairQuickX = gsap.quickTo(crosshairs, "x", { duration: 0.7, ease: "power2.out" });
        crosshairQuickY = gsap.quickTo(crosshairs, "y", { duration: 0.7, ease: "power2.out" });
      }
    }

    function onMouseMove(e) {
      if (!splashCompleted || window.innerWidth <= 640) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const normX = (e.clientX / window.innerWidth) - 0.5;
      const normY = (e.clientY / window.innerHeight) - 0.5;

      if (cardTiltYQuick) cardTiltYQuick(normX * 8);
      if (cardTiltXQuick) cardTiltXQuick(-normY * 8);
      if (crosshairQuickX) crosshairQuickX(normX * 12);
      if (crosshairQuickY) crosshairQuickY(normY * 12);
    }

    function onMouseLeave() {
      if (window.innerWidth <= 640) return;
      if (cardTiltYQuick) cardTiltYQuick(0);
      if (cardTiltXQuick) cardTiltXQuick(0);
      if (crosshairQuickX) crosshairQuickX(0);
      if (crosshairQuickY) crosshairQuickY(0);
    }

    function initScrollTriggerAnimations() {
      if (typeof ScrollTrigger === "undefined" || !card) return;

      ScrollTrigger.create({
        trigger: card,
        start: "top 90%",
        onEnter: () => {
          gsap.fromTo(card,
            { scale: 0.98, opacity: 0.8 },
            { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out", clearProps: "transform,opacity" }
          );
        }
      });
    }

    function playPageEntrance() {
      contentWrapper.style.opacity = "1";
      contentWrapper.style.visibility = "visible";

      if (typeof gsap === "undefined") {
        return;
      }

      const isReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (isReduced) {
        return;
      }

      const entranceTl = gsap.timeline({
        onComplete: () => {
          contentWrapper.style.opacity = "1";
          contentWrapper.style.visibility = "visible";
          gsap.set([card, ".mobile-header-bar", ".mobile-controls", ".click-hint", ".realtime-dashboard"], {
            clearProps: "transform"
          });
        }
      });

      entranceTl
        .fromTo(contentWrapper,
          { opacity: 0.2, scale: 0.96 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }
        )
        .fromTo([".mobile-header-bar", ".realtime-dashboard", ".click-hint"],
          { opacity: 0, y: -8 },
          { opacity: 1, y: 0, duration: 0.35, stagger: 0.06, ease: "power2.out", clearProps: "transform,opacity" },
          "-=0.25"
        )
        .fromTo(card,
          { opacity: 0, scale: 0.95, y: 15 },
          { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.5)", clearProps: "transform,opacity" },
          "-=0.25"
        )
        .fromTo(".word-span",
          { y: 25, opacity: 0, rotateX: -45, filter: "blur(4px)" },
          { y: 0, opacity: 1, rotateX: 0, filter: "blur(0px)", stagger: 0.02, duration: 0.4, ease: "back.out(1.8)", clearProps: "transform,opacity,filter" },
          "-=0.2"
        )
        .fromTo(".mobile-controls",
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", clearProps: "transform,opacity" },
          "-=0.2"
        );
    }

    function runSplashSequence() {
      if (typeof gsap === "undefined") {
        finishSplash();
        return;
      }

      const tl = gsap.timeline({
        onComplete: finishSplash
      });

      tl.fromTo(splashCard, 
        { opacity: 0, scale: 0.94, y: 16, filter: "blur(6px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }
      );

      tl.to(progressFill, {
        width: "100%",
        duration: 1.4,
        ease: "power2.inOut"
      }, 0.2);

      const counterObj = { val: 0 };
      tl.to(counterObj, {
        val: 100,
        duration: 1.4,
        ease: "power2.inOut",
        onUpdate: () => {
          const v = Math.round(counterObj.val);
          progressPercent.textContent = v + "%";
          if (v > 65 && splashState && splashState.textContent !== "ACCESS GRANTED") {
            splashState.textContent = "ACCESS GRANTED";
          }
        }
      }, 0.2);

      tl.call(() => {
        if (splashTitle) {
          splashTitle.textContent = "SYSTEM HACKED!";
        }
      }, null, 1.45);

      tl.to(splashCard, {
        boxShadow: "0 0 80px rgba(255, 43, 43, 0.75), 0 0 20px rgba(255, 43, 43, 0.5)",
        borderColor: "#FF2B2B",
        duration: 0.18,
        yoyo: true,
        repeat: 1
      }, 1.45);

      tl.to(splashScreen, {
        opacity: 0,
        scale: 1.06,
        filter: "blur(10px)",
        duration: 0.35,
        ease: "power3.inOut",
        pointerEvents: "none"
      }, 1.75);
    }

    function finishSplash() {
      if (splashCompleted) return;
      splashCompleted = true;

      if (typeof gsap !== "undefined") {
        gsap.killTweensOf([splashScreen, splashCard, progressFill]);
      }

      splashScreen.style.display = "none";
      splashScreen.style.pointerEvents = "none";
      contentWrapper.style.opacity = "1";
      contentWrapper.style.visibility = "visible";
      contentWrapper.style.display = "flex";

      if (!statementText.innerHTML.trim()) {
        currentIndex = Math.floor(Math.random() * STATEMENTS.length);
        renderWords(STATEMENTS[currentIndex]);
      }
      playPageEntrance();
    }

    function showNextStatement(e) {
      if (!splashCompleted) {
        finishSplash();
        return;
      }
      if (isAnimatingText) return;

      if (navigator.vibrate) {
        try { navigator.vibrate(25); } catch(err) {}
      }

      if (e && typeof e.clientX === "number") {
        spawnEmojiBurst(e.clientX, e.clientY);
      } else if (card) {
        const rect = card.getBoundingClientRect();
        spawnEmojiBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * STATEMENTS.length);
      } while (nextIndex === currentIndex && STATEMENTS.length > 1);

      currentIndex = nextIndex;
      const newText = STATEMENTS[currentIndex];

      if (typeof gsap !== "undefined") {
        isAnimatingText = true;

        const currentWordSpans = gsap.utils.toArray(".word-span");

        const tl = gsap.timeline({
          onComplete: () => {
            isAnimatingText = false;
          }
        });

        tl.to(currentWordSpans, {
          y: -22,
          opacity: 0,
          rotateX: 45,
          filter: "blur(4px)",
          stagger: 0.012,
          duration: 0.14,
          ease: "power2.in",
          onComplete: () => {
            renderWords(newText);
          }
        });

        tl.fromTo(card,
          { scale: 0.97, borderColor: "rgba(255, 43, 43, 0.85)", boxShadow: "0 0 75px rgba(255, 43, 43, 0.55), 0 35px 70px rgba(0,0,0,0.95)" },
          { scale: 1, borderColor: "var(--card-border)", boxShadow: "0 0 60px -15px rgba(220, 38, 38, 0.35), 0 30px 60px rgba(0, 0, 0, 0.9)", duration: 0.35, ease: "back.out(2)", clearProps: "borderColor,boxShadow" },
          "-=0.08"
        );

        tl.fromTo(".word-span",
          { y: 30, opacity: 0, rotateX: -60, filter: "blur(6px)" },
          { y: 0, opacity: 1, rotateX: 0, filter: "blur(0px)", stagger: 0.02, duration: 0.4, ease: "back.out(1.8)" },
          "-=0.12"
        );

        if (btnMobileNext) {
          animateButtonPop(btnMobileNext);
        }
      } else {
        renderWords(newText);
      }
    }

    function onDocumentClick(e) {
      if (e.target && e.target.closest("#btnSkip")) return;
      showNextStatement(e);
    }

    function onMobileBtnClick(e) {
      e.stopPropagation();
      showNextStatement(e);
    }

    function onKeyDown(e) {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        showNextStatement();
      }
    }

    function onSkipClick(e) {
      e.stopPropagation();
      finishSplash();
    }

    function onSplashOverlayClick(e) {
      if (e.target && e.target.closest("#btnSkip")) return;
      finishSplash();
    }

    function setupEventListeners() {
      document.removeEventListener("click", onDocumentClick);
      document.addEventListener("click", onDocumentClick);

      window.removeEventListener("mousemove", onMouseMove);
      window.addEventListener("mousemove", onMouseMove);

      window.removeEventListener("mouseleave", onMouseLeave);
      window.addEventListener("mouseleave", onMouseLeave);

      document.removeEventListener("keydown", onKeyDown);
      document.addEventListener("keydown", onKeyDown);

      if (btnMobileNext) {
        btnMobileNext.removeEventListener("click", onMobileBtnClick);
        btnMobileNext.addEventListener("click", onMobileBtnClick);
      }

      if (btnSkip) {
        btnSkip.removeEventListener("click", onSkipClick);
        btnSkip.addEventListener("click", onSkipClick);
      }

      if (splashScreen) {
        splashScreen.removeEventListener("click", onSplashOverlayClick);
        splashScreen.addEventListener("click", onSplashOverlayClick);
      }
    }

    function initAllGSAP() {
      cleanupAnimations();

      if (typeof gsap === "undefined") return;

      if (typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
      }

      animContext = gsap.context(() => {
        initAmbientGSAP();
        initInteractiveGSAP();
        initScrollTriggerAnimations();
        initRealtimeActive();
      });

      setupEventListeners();
    }

    function boot() {
      currentIndex = Math.floor(Math.random() * STATEMENTS.length);
      renderWords(STATEMENTS[currentIndex]);
      initAllGSAP();
      runSplashSequence();
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
