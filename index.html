<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOU ARE STUPID.</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-black: #0A0A0A;
      --card-bg: #141414;
      --card-border: #DC2626;
      --red-primary: #FF2A2A;
      --red-glow: rgba(255, 42, 42, 0.35);
      --red-dark: #991B1B;
      --text-main: #FF2A2A;
      --shadow-glow: 0 0 50px -10px rgba(220, 38, 38, 0.4), 0 25px 60px rgba(0, 0, 0, 0.95);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
      cursor: pointer;
      user-select: none;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(220, 38, 38, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(185, 28, 28, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.08) 0%, transparent 60%);
    }

    /* Floating shapes in the background */
    .shapes-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .shape {
      position: absolute;
      opacity: 0.55;
      animation: floatIdle 9s ease-in-out infinite alternate;
      transition: transform 0.3s ease;
    }

    .shape-blob1 {
      top: 10%;
      left: 8%;
      width: 80px;
      height: 80px;
      background: rgba(220, 38, 38, 0.35);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      animation-duration: 10s;
      filter: blur(1px);
    }

    .shape-blob2 {
      top: 15%;
      right: 10%;
      width: 90px;
      height: 90px;
      background: rgba(153, 27, 27, 0.4);
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      animation-duration: 12s;
      animation-delay: -3s;
      filter: blur(1px);
    }

    .shape-circle {
      bottom: 15%;
      left: 10%;
      width: 60px;
      height: 60px;
      background: rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      animation-duration: 8s;
      animation-delay: -1.5s;
    }

    .shape-star {
      top: 45%;
      right: 8%;
      font-size: 2.5rem;
      color: #EF4444;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      animation-duration: 11s;
      animation-delay: -4s;
    }

    .shape-pill {
      bottom: 20%;
      right: 12%;
      width: 70px;
      height: 28px;
      background: rgba(185, 28, 28, 0.35);
      border-radius: 9999px;
      transform: rotate(-25deg);
      animation-duration: 9.5s;
      animation-delay: -2s;
    }

    .shape-sparkle {
      top: 25%;
      left: 12%;
      font-size: 2rem;
      color: #DC2626;
      text-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
      animation-duration: 8.5s;
      animation-delay: -5s;
    }

    @keyframes floatIdle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(6deg); }
      100% { transform: translateY(8px) rotate(-5deg); }
    }

    .shapes-container.nudged .shape {
      transform: scale(1.25) rotate(15deg);
      filter: brightness(1.4);
    }

    /* Main Container */
    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
    }

    /* Card holding the big statement */
    .statement-card {
      background: var(--card-bg);
      border-radius: 36px;
      padding: clamp(2.5rem, 8vw, 4.5rem) clamp(2rem, 6vw, 4rem);
      box-shadow: var(--shadow-glow);
      border: 3px solid var(--card-border);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .statement-card:hover {
      transform: translateY(-3px);
      border-color: #FF3B3B;
      box-shadow: 0 0 70px -5px rgba(220, 38, 38, 0.6), 0 25px 60px rgba(0, 0, 0, 0.95);
    }

    .statement-card:active {
      transform: scale(0.98);
    }

    /* The Main Statement */
    .main-text {
      font-size: clamp(2.6rem, 8.5vw, 5.2rem);
      font-weight: 950;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 28px rgba(255, 42, 42, 0.4);
      word-break: break-word;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .main-text.pop {
      animation: popAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.35);
    }

    @keyframes popAnim {
      0% {
        opacity: 0.2;
        transform: scale(0.92) rotate(-1.5deg);
      }
      60% {
        transform: scale(1.04) rotate(0.8deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Subtle tap hint */
    .click-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #FF4D4D;
      background: rgba(220, 38, 38, 0.14);
      border: 1.5px solid rgba(239, 68, 68, 0.45);
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.2);
      padding: 0.55rem 1.35rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.5rem;
      pointer-events: none;
    }

    /* Motion reduction */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Floating shapes in background -->
  <div class="shapes-container" id="shapesContainer" aria-hidden="true">
    <div class="shape shape-blob1"></div>
    <div class="shape shape-blob2"></div>
    <div class="shape shape-circle"></div>
    <div class="shape shape-star">★</div>
    <div class="shape shape-pill"></div>
    <div class="shape shape-sparkle">✦</div>
  </div>

  <div class="content-wrapper">
    <div class="statement-card" id="card">
      <h1 class="main-text" id="statementText">YOU ARE STUPID.</h1>
      <div class="click-hint">
        <span>👆</span>
        <span>Click anywhere for another one</span>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       30 "YOU ARE STUPID" STYLE CONTENT STATEMENTS
       ========================================================================== */
    const STATEMENTS = [
      "YOU ARE STUPID.",
      "YOU ARE AN IDIOT.",
      "YOU ARE A CERTIFIED CLOWN.",
      "YOU ARE COMPLETELY CLUELESS.",
      "YOU ARE OPERATING ON HALF A BRAIN CELL.",
      "YOU ARE THE REASON SHAMPOO HAS INSTRUCTIONS.",
      "YOU ARE CONFIDENTLY INCORRECT.",
      "YOU ARE AN ABSOLUTE DISASTER.",
      "YOU ARE RUNNING AT ROOM TEMPERATURE IQ.",
      "YOU ARE A HUMAN PARTICIPATION TROPHY.",
      "YOU ARE NOT THE SHARPEST TOOL IN THE SHED.",
      "YOU ARE PROBABLY PUSHING A DOOR THAT SAYS PULL.",
      "YOU ARE AN EMBARRASSMENT TO EVOLUTION.",
      "YOU ARE A PROFESSIONAL TIME-WASTER.",
      "YOU ARE A WALKING, TALKING MISTAKE.",
      "YOU ARE LOOKING FOR YOUR PHONE WHILE HOLDING IT.",
      "YOU ARE LIVING ON BORROWED BRAIN CELLS.",
      "YOU ARE AN UNSKIPPABLE AD OF A HUMAN BEING.",
      "YOU ARE CONFUSED BY VERY SIMPLE CONCEPTS.",
      "YOU ARE NATURALLY GIFTED AT BEING WRONG.",
      "YOU ARE OUT OF ORDER.",
      "YOU ARE A WEAPON OF MASS DISAPPOINTMENT.",
      "YOU ARE GOING TO TRIP OVER ABSOLUTELY NOTHING.",
      "YOU ARE A TOTAL WASTE OF BANDWIDTH.",
      "YOU ARE STRUGGLING WITH BASIC EXISTENCE.",
      "YOU ARE STRUGGLING WITH BASIC LIFE INSTRUCTIONS.",
      "YOU ARE THE DEFINITION OF UNHELPFUL.",
      "YOU ARE OPERATING WITHOUT A LICENSE TO THINK.",
      "YOU ARE PROVING MY POINT BY STAYING HERE.",
      "YOU ARE, WITHOUT A DOUBT, EXTRAORDINARILY STUPID."
    ];

    let currentIndex = 0;
    const statementText = document.getElementById("statementText");
    const shapesContainer = document.getElementById("shapesContainer");

    function showNext() {
      // Pick next index, avoiding immediate repeat
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * STATEMENTS.length);
      } while (nextIndex === currentIndex && STATEMENTS.length > 1);

      currentIndex = nextIndex;
      statementText.textContent = STATEMENTS[currentIndex];

      // Re-trigger animation
      statementText.classList.remove("pop");
      void statementText.offsetWidth; // Force reflow
      statementText.classList.add("pop");

      // Nudge shapes
      shapesContainer.classList.add("nudged");
      setTimeout(() => {
        shapesContainer.classList.remove("nudged");
      }, 300);
    }

    // Click anywhere to change
    document.addEventListener("click", showNext);

    // Keyboard support (Space or Enter)
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        showNext();
      }
    });
  </script>
</body>
</html>
